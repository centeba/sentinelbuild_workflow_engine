name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Blocking ruff rules (bug-catching + cleaned style families). The full
  # ruleset runs advisory below.
  CRIT_SELECT: "E9,F5,F63,F7,F811,F401,I,UP015,UP017,UP028,UP035,UP041,RUF010,RUF022,E401,W"

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.10"
      - name: Bug-catching + cleaned style (BLOCKING)
        run: ruff check . --no-cache --select "$CRIT_SELECT"
      - name: Formatting (BLOCKING)
        if: always()
        run: ruff format --check .
      - name: Full ruleset (advisory)
        if: always()
        continue-on-error: true
        run: ruff check . --no-cache

  mypy:
    name: mypy (strict)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pulls smart-llm from git)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy
      - name: mypy strict
        run: mypy api temporal shared

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + test deps (pulls smart-llm from git)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  flutter:
    name: flutter (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_package
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  web:
    name: react-admin (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
