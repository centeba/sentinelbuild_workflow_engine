[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mitstack"
version = "0.1.0"
description = "n8n-equivalent workflow automation platform — embeddable engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["workflow", "automation", "temporal", "orchestration"]

dependencies = [
    # smart-llm provides the agentic LLM layer, key store, observability +
    # service-runtime rails. Pinned to a public commit; bump the ref to pull
    # upstream fixes (see README "Updating smart-llm").
    "smart-llm[db,observability] @ git+https://github.com/centeba/smart-llm@ad295adca2fb44f0a49e91883942f1778bb2d789",
    "fastapi>=0.136.0,<0.137.0",
    "uvicorn[standard]>=0.45.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "redis[asyncio]>=7.4.0",
    "temporalio>=1.26.0",
    "PyJWT>=2.13.0",
    # auth_service uses the bcrypt library directly (passlib is unmaintained and
    # breaks against bcrypt >= 4.1).
    "bcrypt>=4.0",
    "python-multipart>=0.0.26",
    "cryptography>=46.0.7",
    "httpx>=0.28.1",
    "playwright>=1.58.0",
    "pyotp>=2.9.0",
    "jmespath>=1.1.0",
    "jsonpath-ng>=1.8.0",
    "RestrictedPython>=8.1",
    "aiosmtplib>=5.1.0",
    "aioimaplib>=2.0.1",
    "boto3>=1.42.93",
    "openpyxl>=3.1.5",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.0",
    "orjson>=3.11.8",
    "python-dotenv>=1.0.0",
    "mail-parser>=4.1.4",
    "structlog>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0.0",  # the --cov-fail-under gate in pytest.ini needs the plugin declared (SB-04)
    "httpx>=0.28",  # for TestClient
    "aiosqlite>=0.20",  # in-memory async SQLite for DB-backed tests
]

[project.scripts]
# Start the API server
mitstack-api = "api.main:app"
# Start the Temporal worker
mitstack-worker = "temporal.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["api", "temporal", "shared"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ['(^|/)tests/', '(^|/)alembic/', '(^|/)migrations/']

# RestrictedPython ships source but does not explicitly re-export
# compile_restricted / safe_globals / safe_builtins, which trips strict
# no-implicit-reexport once it is installed. Skip following it and treat as
# untyped (mirrors the `emails` handling pattern).
[[tool.mypy.overrides]]
module = ["RestrictedPython", "RestrictedPython.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "smart_llm.*",
    "aioimaplib.*",
    "asyncpg.*",
    "jmespath.*",
    "jsonpath_ng.*",
    "dukpy.*",
    "mailparser.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Blocking gate: bug-catching + cleaned style families (matches CI "critical"
# select). The full ruleset runs advisory in CI (non-blocking).
select = [
    "E9", "F5", "F63", "F7", "F811", "F401", "I",
    "UP015", "UP017", "UP028", "UP035", "UP041",
    "RUF010", "RUF022", "E401", "W",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI DI markers are meant to be called in argument defaults (framework
# contract, not the B008 mutable-default bug). B008 still catches real ones —
# e.g. the two `PublishRequest()` body defaults in api/routers/workflows.py
# remain flagged, which is correct.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Security",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationship forward-refs (``Mapped["Organization"]``, resolved by
# the mapper at configure time from sibling modules) trip F821 "undefined name".
# They are valid at runtime; scope the ignore to the ORM model modules so F821
# still guards the rest of the tree.
"api/models/*.py" = ["F821"]
