[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=api --cov=shared --cov=temporal --cov-report=term-missing --cov-fail-under=30
markers =
    unit: pure unit tests (no database or network)
    api: API integration tests with mocked DB
    temporal: Temporal activity tests
    integration: requires live database
