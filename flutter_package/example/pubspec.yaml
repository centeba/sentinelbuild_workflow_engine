name: mit_stack_example
description: Example app demonstrating how to embed mit_stack in a Flutter application.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  mit_stack:
    path: ../   # the package under test

flutter:
  uses-material-design: true
